# Every commit on main becomes a build on `release`, the branch installs come
# from (`github:dglazkov/sheep#release`), and no release is pushed that the
# package ring did not walk first. Collar phase 3; isocan's shape. Two jobs:
#
#   release  builds the release from this commit, walks it in the package ring
#            from the local repository (scripts/release.mjs does both), and
#            pushes `release` only if the walk held.
#   install  on a bare runner, installs from `github:dglazkov/sheep#release`,
#            the string a user types, and walks the same steps from that spec.
#            This is the ring closest to a user's shell, minutes after the
#            branch changed, and the one that would have caught isocan's #47.
#
# Nothing deploys here; the deployed home from the package is the next project.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# The branch is pushed, never force-pushed, so two runs racing would leave the
# second non-fast-forward. Queue them: every commit gets its release, in order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release branch

env:
  # corepack downloads the pnpm `packageManager` pins; the prompt has no terminal to answer.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          # The release commit names two parents by sha; a shallow clone cannot push a history it does not have.
          fetch-depth: 0
          # pi, the submodule: the `sheep` branch of the public dglazkov/pi.
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 caches for the package manager the manifest pins, and looks for pnpm before
          # corepack has put it there: "Unable to locate executable file: pnpm" (the first run, 7 Sep 2026).
          package-manager-cache: false

      # pnpm at the version package.json pins; the fork's packages are built the way README's setup section says.
      - run: corepack enable

      - name: Build the fork's packages (vendor/pi)
        working-directory: vendor/pi
        run: |
          npm ci --ignore-scripts
          for p in chord tui telemetry ai agent session-backends/sqlite-node protocol client server coding-agent; do
            (cd "packages/$p" && npm run build)
          done

      - run: pnpm install --frozen-lockfile

      # A release nobody tested is a release that installs a broken command. If these fail,
      # main keeps its last good release until the next green commit. The cell's suite runs in workerd.
      - run: pnpm test
      - run: pnpm -r typecheck

      - name: Fetch the release branch the new commit builds on
        run: |
          git fetch --no-tags origin +refs/heads/release:refs/remotes/origin/release \
            || echo "no release branch yet; this run creates it"

      # scripts/release.mjs: the bundles and the Worker, a two-parent commit onto refs/sheep/candidate,
      # the package ring walked against that ref from this repository, and only then refs/heads/release
      # moved and pushed with the job's token. A failed walk is a red run, and the branch does not move.
      - name: Build, walk in the package ring, and push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm release

  install:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No checkout of this repository, and none of its node_modules: only Node, npm, and git, which the runner has.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 caches for the package manager the manifest pins, and looks for pnpm before
          # corepack has put it there: "Unable to locate executable file: pnpm" (the first run, 7 Sep 2026).
          package-manager-cache: false

      # The ring's script is the one file of ours the job needs, and it has no checkout to read it from.
      # A sparse checkout of `scripts/` into a side directory, at this run's commit, rather than a curl of
      # the raw file: the same transport and token as every other step, so a red job here is about the
      # install and not about a CDN. The ring strips that directory from PATH and asserts it; the install
      # itself comes from the spec, which is the point of the job.
      - uses: actions/checkout@v5
        with:
          path: sheep-src
          sparse-checkout: scripts
          submodules: false

      # The user's string, verbatim: SHEEP_INSTALL_SPEC stays unset, so `npx github:dglazkov/sheep#release setup`
      # installs with setup's own default. --commit: the install must be stamped with this run's commit,
      # so a release that did not move does not pass on the previous one.
      - name: Install from github:dglazkov/sheep#release and walk the package ring
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/sheep-src/scripts/hermetic.mjs" --ring package --spec github:dglazkov/sheep#release --commit "$GITHUB_SHA"
